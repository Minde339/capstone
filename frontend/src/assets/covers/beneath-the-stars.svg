<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <radialGradient id="twilightGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff7b72"/>
      <stop offset="40%" stop-color="#792e68"/>
      <stop offset="85%" stop-color="#241442"/>
      <stop offset="100%" stop-color="#110926"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#twilightGrad)"/>
  
  <text x="200" y="80" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#ffffff" text-anchor="middle">Beneath</text>
  <text x="200" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#e9d5ff" text-anchor="middle" letter-spacing="4">THE</text>
  <text x="200" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="3">STARS</text>
  
  <text x="200" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f472b6" text-anchor="middle" letter-spacing="3">A ROMANCE</text>
  
  <!-- Couple Silhouette -->
  <g transform="translate(200, 390)">
    <!-- Man silhouette -->
    <path d="M-55,20 C-55,-25 -40,-45 -20,-45 C-10,-45 0,-30 0,0 L-5,70 L-60,70 Z" fill="#110926"/>
    <circle cx="-25" cy="-60" r="18" fill="#110926"/>
    <!-- Woman silhouette -->
    <path d="M-5,10 C0,-30 15,-40 30,-40 C45,-40 55,-20 55,20 L50,70 L-5,70 Z" fill="#110926"/>
    <circle cx="20" cy="-55" r="16" fill="#110926"/>
    <!-- Hair outline -->
    <path d="M10,-65 C25,-75 40,-60 40,-40 C40,-20 35,0 35,20" fill="none" stroke="#110926" stroke-width="8"/>
  </g>
  
  <!-- Star specks -->
  <circle cx="60" cy="220" r="2" fill="#ffffff"/>
  <circle cx="340" cy="210" r="2.5" fill="#ffffff"/>
  <circle cx="100" cy="280" r="1.5" fill="#ffffff"/>
  <circle cx="300" cy="270" r="2" fill="#ffffff"/>
  <circle cx="150" cy="230" r="1" fill="#ffffff"/>
  <circle cx="260" cy="240" r="1.5" fill="#ffffff"/>
  
  <text x="200" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">JESSICA MARTIN</text>
</svg>
