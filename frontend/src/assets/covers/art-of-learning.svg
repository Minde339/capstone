<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <rect width="400" height="600" fill="#e54332"/>
  
  <text x="200" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">THE ART</text>
  <text x="200" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">OF</text>
  <text x="200" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">LEARNING</text>
  
  <!-- Lightbulb on book -->
  <g transform="translate(200, 360)">
    <!-- Lightbulb -->
    <path d="M-25,-85 C-45,-65 -45,-30 -25,-10 C-15,0 -15,10 -15,15 L15,15 C15,10 15,0 25,-10 C45,-30 45,-65 25,-85 C10,-100 -10,-100 -25,-85 Z" fill="#ffd13b" stroke="#161616" stroke-width="6"/>
    <!-- Light rays -->
    <line x1="0" y1="-120" x2="0" y2="-105" stroke="#ffd13b" stroke-width="6" stroke-linecap="round"/>
    <line x1="-55" y1="-95" x2="-42" y2="-85" stroke="#ffd13b" stroke-width="6" stroke-linecap="round"/>
    <line x1="55" y1="-95" x2="42" y2="-85" stroke="#ffd13b" stroke-width="6" stroke-linecap="round"/>
    <!-- Filament -->
    <path d="M-8,-40 L0,-60 L8,-40" fill="none" stroke="#e54332" stroke-width="4"/>
    <!-- Open Book -->
    <path d="M-75,45 C-45,35 -15,40 0,55 C15,40 45,35 75,45 L70,80 C40,70 15,75 0,90 C-15,75 -40,70 -70,80 Z" fill="#ffffff" stroke="#161616" stroke-width="6"/>
    <path d="M-80,45 C-45,25 -10,35 0,50 L0,85 C-10,70 -45,60 -80,80 Z" fill="#b0e0e6" opacity="0.4"/>
    <path d="M80,45 C45,25 10,35 0,50 L0,85 C10,70 45,60 80,80 Z" fill="#b0e0e6" opacity="0.4"/>
  </g>
  
  <text x="200" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="3">RAJ PATEL</text>
</svg>
