<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <rect width="400" height="600" fill="#f97316"/>
  
  <text x="200" y="80" font-family="Marker Felt, 'Comic Sans MS', sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle">The Lost</text>
  <text x="200" y="130" font-family="Marker Felt, 'Comic Sans MS', sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle">Kitten</text>
  
  <!-- Butterfly -->
  <g transform="translate(320, 180) rotate(20) scale(0.6)">
    <ellipse cx="-15" cy="-10" rx="15" ry="25" fill="#fef08a" opacity="0.9"/>
    <ellipse cx="15" cy="-10" rx="15" ry="25" fill="#fef08a" opacity="0.9"/>
    <ellipse cx="-10" cy="15" rx="10" ry="18" fill="#fde047" opacity="0.9"/>
    <ellipse cx="10" cy="15" rx="10" ry="18" fill="#fde047" opacity="0.9"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#1c1917" stroke-width="4"/>
  </g>
  
  <!-- Cute Kitten Illustration -->
  <g transform="translate(200, 320)">
    <!-- Body -->
    <ellipse cx="0" cy="60" rx="70" ry="65" fill="#ea580c"/>
    <ellipse cx="0" cy="70" rx="45" ry="45" fill="#fed7aa"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="-20" rx="75" ry="60" fill="#ea580c"/>
    <ellipse cx="0" cy="-10" rx="55" ry="42" fill="#fed7aa"/>
    
    <!-- Ears -->
    <polygon points="-65,-40 -40,-95 -15,-45" fill="#ea580c"/>
    <polygon points="-55,-45 -40,-85 -25,-48" fill="#fbcfe8"/>
    <polygon points="15,-45 40,-95 65,-40" fill="#ea580c"/>
    <polygon points="25,-48 40,-85 55,-45" fill="#fbcfe8"/>
    
    <!-- Big cute eyes -->
    <ellipse cx="-25" cy="-20" rx="12" ry="16" fill="#18181b"/>
    <circle cx="-28" cy="-25" r="5" fill="#ffffff"/>
    <circle cx="-22" cy="-15" r="2" fill="#ffffff"/>
    
    <ellipse cx="25" cy="-20" rx="12" ry="16" fill="#18181b"/>
    <circle cx="22" cy="-25" r="5" fill="#ffffff"/>
    <circle cx="28" cy="-15" r="2" fill="#ffffff"/>
    
    <!-- Nose & Mouth -->
    <polygon points="-4,-2 4,-2 0,3" fill="#f43f5e"/>
    <path d="M-10,8 Q0,15 10,8" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Whiskers -->
    <line x1="-35" y1="0" x2="-75" y2="-10" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
    <line x1="-35" y1="5" x2="-75" y2="8" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="0" x2="75" y2="-10" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="5" x2="75" y2="8" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Paws -->
    <ellipse cx="-35" cy="115" rx="22" ry="14" fill="#ea580c"/>
    <ellipse cx="35" cy="115" rx="22" ry="14" fill="#ea580c"/>
  </g>
  
  <!-- Plant Leaves at bottom -->
  <path d="M40,520 Q80,480 70,540 Q100,490 100,560" fill="none" stroke="#65a30d" stroke-width="5" stroke-linecap="round"/>
  <path d="M360,520 Q320,480 330,540 Q300,490 300,560" fill="none" stroke="#65a30d" stroke-width="5" stroke-linecap="round"/>
  
  <text x="200" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">EMILY PARKER</text>
</svg>
