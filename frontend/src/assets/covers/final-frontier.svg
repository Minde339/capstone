<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="deepSpace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#021B38"/>
      <stop offset="60%" stop-color="#042C54"/>
      <stop offset="100%" stop-color="#0a4674"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#deepSpace)"/>
  
  <text x="200" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">THE</text>
  <text x="200" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">FINAL</text>
  <text x="200" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#ffffff" text-anchor="middle" letter-spacing="3">FRONTIER</text>
  
  <!-- Planet with ring -->
  <circle cx="310" cy="220" r="18" fill="#e2b96f"/>
  <ellipse cx="310" cy="220" rx="30" ry="7" fill="none" stroke="#fef08a" stroke-width="3" transform="rotate(-25, 310, 220)"/>
  
  <!-- Rocket blasting upward -->
  <g transform="translate(180, 360) rotate(-35)">
    <!-- Rocket exhaust fire -->
    <polygon points="-12,50 0,95 12,50" fill="#f97316"/>
    <polygon points="-6,50 0,80 6,50" fill="#facc15"/>
    
    <!-- Rocket body -->
    <path d="M-18,50 L-18,0 Q-18,-50 0,-70 Q18,-50 18,0 L18,50 Z" fill="#ffffff"/>
    <path d="M-18,-25 Q-18,-50 0,-70 Q18,-50 18,-25 Z" fill="#dc2626"/>
    <!-- Fins -->
    <polygon points="-18,20 -38,55 -18,50" fill="#dc2626"/>
    <polygon points="18,20 38,55 18,50" fill="#dc2626"/>
    <!-- Window -->
    <circle cx="0" cy="-10" r="8" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  </g>
  
  <!-- Earth / Moon curve at bottom -->
  <path d="M-20,620 Q200,460 420,620 Z" fill="#0ea5e9" opacity="0.4"/>
  <path d="M0,640 Q200,500 400,640 Z" fill="#38bdf8" opacity="0.6"/>
  
  <text x="200" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">LAURA</text>
  <text x="200" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">MITCHELL</text>
</svg>
