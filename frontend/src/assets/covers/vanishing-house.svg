<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mysticGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2f2e"/>
      <stop offset="60%" stop-color="#1b4d4a"/>
      <stop offset="100%" stop-color="#091b1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#mysticGreen)"/>
  
  <text x="200" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">THE</text>
  <text x="200" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">VANISHING</text>
  <text x="200" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">HOUSE</text>
  
  <!-- Glowing Full Moon -->
  <circle cx="120" cy="245" r="28" fill="#fef08a" opacity="0.9"/>
  <circle cx="120" cy="245" r="38" fill="#fef08a" opacity="0.2"/>
  
  <!-- Mysterious House Silhouette -->
  <g transform="translate(240, 290)">
    <!-- Main House -->
    <rect x="-80" y="-30" width="120" height="90" fill="#061615"/>
    <!-- Roof -->
    <polygon points="-90,-30 -20,-85 50,-30" fill="#061615"/>
    <polygon points="10,-30 45,-75 80,-30" fill="#061615"/>
    <rect x="20" y="-30" width="50" height="90" fill="#061615"/>
    <!-- Spire / Tower -->
    <polygon points="-60,-30 -45,-110 -30,-30" fill="#061615"/>
    <!-- Yellow glowing windows -->
    <rect x="-65" y="-15" width="18" height="24" fill="#fef08a"/>
    <rect x="-30" y="-15" width="18" height="24" fill="#fef08a"/>
    <rect x="35" y="-15" width="18" height="24" fill="#fef08a"/>
  </g>
  
  <!-- Misty ground and lone figure -->
  <path d="M0,420 Q200,390 400,420 L400,600 L0,600 Z" fill="#091b1a"/>
  <circle cx="140" cy="390" r="10" fill="#040d0c"/>
  <path d="M130,400 L150,400 L155,460 L125,460 Z" fill="#040d0c"/>
  
  <text x="200" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">CLARA NELSON</text>
</svg>
