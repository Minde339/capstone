<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#nightSky)"/>
  
  <text x="200" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="4">A NOVEL</text>
  <text x="200" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#93c5fd" text-anchor="middle" letter-spacing="2">THE</text>
  <text x="200" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#93c5fd" text-anchor="middle" letter-spacing="2">MIDNIGHT</text>
  <text x="200" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#93c5fd" text-anchor="middle" letter-spacing="2">HOUR</text>
  
  <!-- Streetlamp -->
  <circle cx="80" cy="330" r="45" fill="url(#lampGlow)"/>
  <rect x="76" y="315" width="8" height="150" fill="#334155"/>
  <path d="M70,315 L90,315 L85,295 L75,295 Z" fill="#475569"/>
  <circle cx="80" cy="308" r="5" fill="#fde047"/>
  
  <!-- Silhouette Buildings -->
  <rect x="0" y="260" width="120" height="340" fill="#0f172a" opacity="0.6"/>
  <rect x="280" y="240" width="120" height="360" fill="#0f172a" opacity="0.6"/>
  
  <!-- Silhouette Person walking away in coat -->
  <g transform="translate(200, 420)">
    <circle cx="0" cy="-60" r="14" fill="#020617"/>
    <path d="M-18,-40 L18,-40 L26,40 L-26,40 Z" fill="#020617"/>
    <line x1="-12" y1="40" x2="-14" y2="90" stroke="#020617" stroke-width="10" stroke-linecap="round"/>
    <line x1="12" y1="40" x2="16" y2="85" stroke="#020617" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <text x="200" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">JAMES ADAMS</text>
</svg>
