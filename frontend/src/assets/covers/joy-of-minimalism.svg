<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <rect width="400" height="600" fill="#facc15"/>
  
  <text x="200" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#18181b" text-anchor="middle" letter-spacing="2">THE JOY OF</text>
  <text x="200" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#18181b" text-anchor="middle" letter-spacing="2">MINIMALISM</text>
  
  <!-- Minimalist nested arch design -->
  <g transform="translate(200, 310)">
    <path d="M-80,60 A80,80 0 0,1 80,60" fill="none" stroke="#18181b" stroke-width="26" stroke-linecap="round"/>
    <path d="M-40,60 A40,40 0 0,1 40,60" fill="none" stroke="#eab308" stroke-width="24" stroke-linecap="round"/>
    <circle cx="0" cy="50" r="16" fill="#18181b"/>
  </g>
  
  <text x="200" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#3f3f46" text-anchor="middle">Simplify your life for</text>
  <text x="200" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#3f3f46" text-anchor="middle">greater clarity and happiness</text>
  
  <text x="200" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#18181b" text-anchor="middle" letter-spacing="3">DANIEL REED</text>
</svg>
