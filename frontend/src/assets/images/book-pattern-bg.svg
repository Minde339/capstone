<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14345c"/>
      <stop offset="50%" stop-color="#1a416e"/>
      <stop offset="100%" stop-color="#102a4a"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  
  <!-- Floating isometric closed book top left -->
  <g transform="translate(180, 180) rotate(-22)" opacity="0.65">
    <!-- book cover -->
    <rect x="0" y="0" width="220" height="280" rx="12" fill="#c05621"/>
    <rect x="25" y="45" width="170" height="110" rx="6" fill="#9b2c2c" opacity="0.7"/>
    <!-- pages edge -->
    <path d="M0,280 L20,320 L240,320 L220,280 Z" fill="#fefcbf"/>
  </g>
  
  <!-- Floating closed book bottom left -->
  <g transform="translate(160, 680) rotate(12)" opacity="0.75">
    <rect x="0" y="0" width="260" height="90" rx="10" fill="#2b6cb0"/>
    <path d="M0,90 L0,150 L260,150 L260,90 Z" fill="#dd6b20"/>
    <path d="M260,0 L320,40 L320,180 L260,150 Z" fill="#fefcbf"/>
  </g>
  
  <!-- Floating open book bottom right -->
  <g transform="translate(950, 720) rotate(-10)" opacity="0.8">
    <path d="M-220,100 C-120,40 0,60 0,110 C0,60 120,40 220,100 L200,240 C100,180 0,200 0,240 C0,200 -100,180 -200,240 Z" fill="#fefcbf"/>
    <path d="M-220,100 C-120,40 0,60 0,110 L0,240 C0,200 -100,180 -200,240 Z" fill="#faf089" opacity="0.4"/>
    <path d="M-230,110 C-130,50 0,70 0,120 L0,250 C0,210 -110,190 -210,250 Z" fill="#dd6b20" opacity="0.7"/>
  </g>
  
  <!-- Floating confetti, diamonds, squiggles -->
  <rect x="680" y="110" width="30" height="30" fill="#ecc94b" transform="rotate(45, 695, 125)" opacity="0.6"/>
  <rect x="1220" y="380" width="24" height="24" fill="#ecc94b" transform="rotate(25, 1232, 392)" opacity="0.6"/>
  <rect x="90" y="380" width="28" height="28" fill="#dd6b20" transform="rotate(15, 104, 394)" opacity="0.7"/>
  <circle cx="1120" cy="380" r="22" fill="#c05621" opacity="0.6"/>
  
  <!-- Squiggles -->
  <path d="M70,120 Q120,70 170,130" fill="none" stroke="#ecc94b" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M980,420 Q1040,580 1120,480 T1260,600" fill="none" stroke="#ecc94b" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M80,680 Q140,650 180,720" fill="none" stroke="#63b3ed" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
